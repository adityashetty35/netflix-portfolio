      <stop offset="0" stop-color="#1a0203"/>
      <stop offset="0.6" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="ex-glow" cx="0.5" cy="0.45" r="0.6">
