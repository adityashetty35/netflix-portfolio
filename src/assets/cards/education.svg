<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ed-bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a0203"/>
      <stop offset="0.6" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="ed-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#e50914" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ed-bg)"/>
  <rect width="800" height="450" fill="url(#ed-glow)"/>
  <g stroke="#3a3a3a" stroke-width="1" opacity="0.3">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="338" x2="800" y2="338"/>
  </g>

  <g transform="translate(400,215)">
    <!-- mortarboard -->
    <path d="M 0 -80 L 160 -20 L 0 40 L -160 -20 Z" fill="#e5e5e5"/>
    <path d="M 0 -80 L 160 -20 L 0 40 L -160 -20 Z" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M -95 -3 L -95 62 A 95 42 0 0 0 95 62 L 95 -3" fill="#181818" stroke="#e50914" stroke-width="9" stroke-linejoin="round"/>
    <!-- tassel -->
    <path d="M 160 -20 L 160 60" stroke="#e50914" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="160" cy="72" r="14" fill="#e50914"/>
  </g>
</svg>
