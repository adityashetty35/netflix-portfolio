<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-case" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow-case" cx="0.75" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#e50914" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-case)"/>
  <rect width="800" height="450" fill="url(#glow-case)"/>

  <g stroke="#3a3a3a" stroke-width="1" opacity="0.35">
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
  </g>

  <!-- Scale of justice -->
  <g transform="translate(400,235)">
    <rect x="-3" y="-95" width="6" height="150" fill="#e5e5e5"/>
    <rect x="-70" y="-98" width="140" height="8" rx="4" fill="#e50914"/>
    <circle cx="-70" cy="-90" r="4" fill="#f5f5f5"/>
    <circle cx="70" cy="-90" r="4" fill="#f5f5f5"/>

    <line x1="-70" y1="-90" x2="-105" y2="-30" stroke="#8f8f8f" stroke-width="1.5"/>
    <line x1="-70" y1="-90" x2="-35" y2="-30" stroke="#8f8f8f" stroke-width="1.5"/>
    <path d="M -115 -30 A 40 40 0 0 0 -25 -30 Z" fill="#1f1f1f" stroke="#e5e5e5" stroke-width="1.5"/>

    <line x1="70" y1="-90" x2="35" y2="-30" stroke="#8f8f8f" stroke-width="1.5"/>
    <line x1="70" y1="-90" x2="105" y2="-30" stroke="#8f8f8f" stroke-width="1.5"/>
    <path d="M 25 -30 A 40 40 0 0 0 115 -30 Z" fill="#1f1f1f" stroke="#e5e5e5" stroke-width="1.5"/>

    <rect x="-45" y="55" width="90" height="14" rx="3" fill="#e5e5e5"/>
  </g>

  <!-- Document stack -->
  <g transform="translate(150,270)">
    <rect x="0" y="20" width="120" height="150" rx="6" fill="#181818" stroke="#e50914" stroke-width="2"/>
    <rect x="14" y="-10" width="120" height="150" rx="6" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <line x1="30" y1="15" x2="118" y2="15" stroke="#8f8f8f" stroke-width="4"/>
    <line x1="30" y1="35" x2="118" y2="35" stroke="#6a6a6a" stroke-width="4"/>
    <line x1="30" y1="55" x2="90" y2="55" stroke="#6a6a6a" stroke-width="4"/>
  </g>

  <text x="60" y="115" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">ENTRUST</text>
  <text x="60" y="143" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c9c9" letter-spacing="2">CASE MANAGEMENT PLATFORM</text>
</svg>
