    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <g stroke="#e50914" stroke-width="1.5" opacity="0.55" fill="none">
    <line x1="400" y1="180" x2="220" y2="290"/>
    <line x1="400" y1="180" x2="400" y2="300"/>
    <line x1="400" y1="180" x2="580" y2="290"/>
    <line x1="220" y1="290" x2="150" y2="350"/>
    <line x1="220" y1="290" x2="260" y2="350"/>
    <line x1="580" y1="290" x2="540" y2="350"/>
    <line x1="580" y1="290" x2="650" y2="350"/>
  </g>

  <circle cx="400" cy="150" r="34" fill="url(#node-fill)"/>
  <circle cx="400" cy="150" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <g fill="#f5f5f5">
