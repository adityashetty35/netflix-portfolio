  <text x="60" y="115" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="1">HOSHI HRMS</text>
  <text x="60" y="143" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c9c9" letter-spacing="2">MULTI-TENANT · CLOUD-NATIVE</text>
