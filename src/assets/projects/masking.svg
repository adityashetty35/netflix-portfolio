<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-mask" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow-mask" cx="0.3" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#e50914" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-mask)"/>
  <rect width="800" height="450" fill="url(#glow-mask)"/>

  <g stroke="#3a3a3a" stroke-width="1" opacity="0.35">
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
  </g>

  <!-- Document with masked lines -->
  <g transform="translate(300,90)">
    <rect x="0" y="0" width="230" height="290" rx="10" fill="#181818" stroke="#3a3a3a" stroke-width="1.5"/>
    <line x1="24" y1="40" x2="140" y2="40" stroke="#6a6a6a" stroke-width="6"/>
    <rect x="24" y="66" width="182" height="16" rx="3" fill="#e50914"/>
    <rect x="24" y="96" width="140" height="16" rx="3" fill="#e50914"/>
    <line x1="24" y1="140" x2="206" y2="140" stroke="#4a4a4a" stroke-width="6"/>
    <line x1="24" y1="166" x2="206" y2="166" stroke="#4a4a4a" stroke-width="6"/>
    <rect x="24" y="192" width="100" height="16" rx="3" fill="#e50914"/>
    <line x1="24" y1="236" x2="180" y2="236" stroke="#4a4a4a" stroke-width="6"/>
    <line x1="24" y1="262" x2="206" y2="262" stroke="#4a4a4a" stroke-width="6"/>
  </g>

  <!-- Scan beam -->
  <g>
    <rect x="270" y="40" width="290" height="10" fill="#ffffff" opacity="0.8"/>
    <rect x="270" y="40" width="290" height="60" fill="#ffffff" opacity="0.06"/>
  </g>

  <!-- Corner brackets (OCR viewport) -->
  <g stroke="#e50914" stroke-width="4" fill="none">
    <path d="M 250 60 L 250 30 L 280 30"/>
    <path d="M 580 60 L 580 30 L 550 30"/>
    <path d="M 250 400 L 250 430 L 280 430"/>
    <path d="M 580 400 L 580 430 L 550 430"/>
  </g>

  <text x="60" y="115" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">DOCUMENT MASKING</text>
  <text x="60" y="143" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c9c9" letter-spacing="2">OCR · TENSORFLOW · REDACTION</text>
</svg>
